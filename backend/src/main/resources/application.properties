spring.application.name=projetosistemaescolar

server.port=8080

# Configurações do Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# database precisa estar criado antes do build do projeto
spring.datasource.url=jdbc:mysql://mysql:3306/mydatabase

# configs temporarias de autenticação, altere se necessário
spring.datasource.username=myuser
spring.datasource.password=secret
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# config jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Campos primitivos opcionais ausentes no JSON devem manter o valor padrao da entidade.
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.docker.compose.enabled=false

# Chave local de desenvolvimento. Em outros ambientes, defina JWT_SECRET.
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-2026}
